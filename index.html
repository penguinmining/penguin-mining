JSON.stringify(pendingOrder)
);

}


function getActivePackage(){

return VIP_PACKAGES.find(
p => p.id === activeVip
) || null;

}


function getRate(){

if(Array.isArray(activeDevices) && activeDevices.length > 0){

return activeDevices.reduce((total, device) => {

const pkg = VIP_PACKAGES.find(p => p.id === Number(device.vip_id));

const quantity = Number(device.quantity || 0);

return total + (pkg ? pkg.rate * quantity : 0);

}, 0);

}

const pkg = getActivePackage();

return pkg ? pkg.rate : BASE_RATE;

}


function updateMining(){

if(!mining){

lastTime = Date.now();

return;

}

const now = Date.now();

const seconds =
(now - lastTime) / 1000;

if(seconds > 0){

mined += seconds * getRate();

}

lastTime = now;

saveData();

}


function startMining(){
 if(mining) return;

 mining = true;
 lastTime = Date.now();
 saveData();
 showMine();

 setInterval(function(){
   if(mining){
     updateMining();
   }
},1000);

}

function stopMining(){

updateMining();

mining = false;

saveData();

showMine();

}


function claimMining(){

updateMining();

if(mined <= 0){

alert("Claim edilecek PENGUIN yok.");

return;

}

wallet += mined;

mined = 0;

saveData();

showMine();

alert(
"Mining balance cüzdan bakiyesine aktarıldı."
);

}

function getDeviceQuantity(vipId){

const device = activeDevices.find(d => Number(d.vip_id) === Number(vipId));

return device ? Number(device.quantity || 0) : 0;

}

function getTotalDeviceCount(){

return activeDevices.reduce((total, device) => {

return total + Number(device.quantity || 0);

}, 0);

function requestWithdraw(){

document

.value
.trim();

const amount =
parseFloat(
document
.getElementById("withdrawAmount")
.value
);


if(!address){

alert(
"Lütfen BEP20 cüzdan adresinizi girin."
);

return;

}


if(!amount || amount <= 0){

alert(
"Lütfen çekim miktarını girin."
);

return;

}


if(amount < MIN_WITHDRAW){

alert(
"Minimum çekim miktarı 15,000 PENGUIN."
);

return;

}


if(amount > wallet){

alert(

function generateReferral(){

let code =
localStorage.getItem(
"referralCode"
);

if(!code){

code =
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

localStorage.setItem(
"referralCode",
code
);

}

return code;

}


function copyReferral(){

const code =
generateReferral();

const link =
"https://t.me/PenguinMiningAppBot?start=" +
code;

navigator.clipboard
.writeText(link)
.then(function(){

alert(
"Referral linki kopyalandı!"
);

})
.catch(function(){

alert(link);

});

}

Telegram.WebApp.ready();
}
const telegramUser = window.Telegram?.WebApp?.initDataUnsafe?.user || null;
const telegramUserId = telegramUser?.id || null;

async function syncTelegramUser(){

if(!telegramUserId) return;

try{

const response = await fetch(
"https://penguin-api.scorpincoin.workers.dev/user",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
telegram_id:String(telegramUserId),
username:telegramUser?.username || null,
first_name:telegramUser?.first_name || null
})
}
);

const data = await response.json();

if(data.ok && data.user){
activeVip = Number(data.user.active_vip || 0);
activeDevices = Array.isArray(data.devices) ? data.devices : [];

if(data.user.referral_code){
localStorage.setItem("referralCode", data.user.referral_code);
}

referralCount = Number(data.referral_count || 0);

saveData();
}

}catch(error){

console.log(
"PENGUIN kullanıcı senkronizasyonu başarısız:",
error
);

}

}
