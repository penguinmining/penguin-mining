translations[currentLanguage][key]) ||

function toggleLanguageMenu(){
const menu = document.getElementById("languageMenu");

menu.style.display =

}
}

localStorage.setItem("mining", mining);

localStorage.setItem("lastTime", lastTime);

localStorage.setItem(
"telegramReward",
telegramReward
);

localStorage.setItem(
"activeVip",
activeVip
);

localStorage.setItem(
"pendingOrder",
JSON.stringify(pendingOrder)
);

}


function getActivePackage(){

return VIP_PACKAGES.find(
p => p.id === activeVip
) || null;

}


function getRate(){

if(Array.isArray(activeDevices) && activeDevices.length > 0){

return activeDevices.reduce((total, device) => {

const pkg = VIP_PACKAGES.find(p => p.id === Number(device.vip_id));

const quantity = Number(device.quantity || 0);

return total + (pkg ? pkg.rate * quantity : 0);

}, 0);

}

const pkg = getActivePackage();

return pkg ? pkg.rate : BASE_RATE;

}


function updateMining(){

if(!mining){

lastTime = Date.now();

return;

}

const now = Date.now();

const seconds =
(now - lastTime) / 1000;

if(seconds > 0){

mined += seconds * getRate();

}

lastTime = now;

saveData();

}


function startMining(){
 if(mining) return;

 mining = true;
 lastTime = Date.now();
 saveData();
 showMine();

 setInterval(function(){
   if(mining){
     updateMining();
   }
},1000);

}

function stopMining(){

updateMining();

mining = false;

saveData();

showMine();

}


function claimMining(){

updateMining();

if(mined <= 0){

alert("Claim edilecek PENGUIN yok.");

return;

}

wallet += mined;

mined = 0;

saveData();

showMine();

alert(
"Mining balance cüzdan bakiyesine aktarıldı."
);

}

const device = activeDevices.find(d => Number(d.vip_id) === Number(vipId));

return total + Number(device.quantity || 0);

}, 0);

async function showCrypto(){
  currentPage = "crypto";

  page.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="logo">₿</div>

        <div style="text-align:center;padding:20px;">
          Loading prices...
        </div>
      </div>
    </div>
  `;

  try{
    const response = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana,ripple,dogecoin,cardano,tron,avalanche-2&vs_currencies=usd"
    );

    const data = await response.json();

    const coins = [
      ["BTC","Bitcoin","bitcoin","₿"],
      ["ETH","Ethereum","ethereum","Ξ"],
      ["BNB","BNB","binancecoin","◆"],
      ["PENGUIN","PENGUIN",null,"🐧"],
      ["SOL","Solana","solana","◎"],
      ["XRP","XRP","ripple","✕"],
      ["DOGE","Dogecoin","dogecoin","Ð"],
      ["ADA","Cardano","cardano","₳"],
      ["TRX","TRON","tron","◆"],
      ["AVAX","Avalanche","avalanche-2","🔺"]
    ];

    const list = document.getElementById("cryptoList");

    list.innerHTML = coins.map((coin,index) => {
      const symbol = coin[0];
      const name = coin[1];
      const apiId = coin[2];
      const icon = coin[3];

      const price = symbol === "PENGUIN"
        ? 0.011
        : Number(data[apiId]?.usd || 0);

      return `
        <div style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          padding:15px 4px;
          border-bottom:${index === coins.length-1 ? "none" : "1px solid rgba(255,255,255,0.08)"};
        ">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="font-size:25px;width:30px;text-align:center;">
              ${icon}
            </div>

            <div>
              <div style="font-weight:700;">
                ${symbol}
              </div>
              <div class="small">
                ${name}
              </div>
            </div>
          </div>

          <div style="font-weight:700;">
            ${price.toLocaleString("en-US",{
              minimumFractionDigits: symbol === "PENGUIN" ? 6 : 2,
              maximumFractionDigits: symbol === "PENGUIN" ? 6 : 6
            })}
          </div>
        </div>
      `;
    }).join("");

  }catch(error){
    document.getElementById("cryptoList").innerHTML = `
      <div style="text-align:center;padding:20px;">
        Unable to load prices.
      </div>
    `;

    console.log("Crypto prices error:",error);
  }
}

function setMaxWithdraw(){
const type=document.getElementById("withdrawType").value;
const amount=document.getElementById("withdrawAmount");

if(type==="usdt"){
amount.value=(wallet*0.011).toFixed(6);
}else{
amount.value=wallet.toFixed(6);
}
}

function updateWithdrawType(){
const type=document.getElementById("withdrawType").value;
const amount=document.getElementById("withdrawAmount");

if(type==="usdt"){
amount.placeholder="USDT miktarı";
amount.min=(MIN_WITHDRAW*0.011).toFixed(6);
}else{
amount.placeholder="Miktar (Min. 15.000 PENGUIN)";
amount.min=MIN_WITHDRAW;
}
}

function requestWithdraw(){

const address =
document
.getElementById("withdrawAddress")
.value
.trim();

const amount =
parseFloat(
document
.getElementById("withdrawAmount")
.value
);

const type =
document.getElementById("withdrawType").value;

let penguinAmount = amount;

if(type === "usdt"){
penguinAmount = amount / 0.011;
}


if(!address){

alert(
"Lütfen BEP20 cüzdan adresinizi girin."
);

return;

}


if(!amount || amount <= 0){

alert(
"Lütfen çekim miktarını girin."
);

return;

}


if(penguinAmount < MIN_WITHDRAW){

alert(
"Minimum çekim miktarı 15,000 PENGUIN."
);

return;

}


if(penguinAmount > wallet){

alert(
"Yetersiz PENGUIN bakiyesi."
);

return;

}


alert(
"Çekim talebiniz alındı. Admin kontrolünden sonra işleme alınacaktır."
);

}


function generateReferral(){

localStorage.getItem(
"referralCode"
);

Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

localStorage.setItem(
"referralCode",

);

}

return code;

}
